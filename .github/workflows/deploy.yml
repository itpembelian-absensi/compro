name: Deploy Compro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: [self-hosted, compro]

    steps:
      - name: Deploy to /srv/node/compro
        run: |
          cd /srv/node/compro
          git fetch origin main
          git reset --hard origin/main
          git clean -fd -e node_modules
          pm2 restart compro || pm2 start ecosystem.config.cjs
          pm2 save
